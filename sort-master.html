<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>仕分け先マスター / 配置設定</title><link rel="stylesheet" href="css/style.css?v=sort-master-20260819c"></head>
<body class="sort-import-body"><div class="sort-page">
<header class="sort-header"><div><h2>仕分け先マスター / 配置設定</h2><p class="sort-note">仕分け先コードと物理位置を固定します。</p></div><div class="sort-nav"><a class="btn btn-outline" href="sort-import.html">取込へ戻る</a><a class="btn btn-outline" href="index.html">HOME</a></div></header>
<main class="sort-main">
 <div id="activeNotice" class="card sort-card sort-master-notice" hidden><strong>現在、稼働中の卸仕分けバッチがあります。</strong><br>マスターの変更は現在のバッチには反映されません。次回の取込・バッチ作成から反映されます。</div>
 <section class="card sort-card"><div id="summary" class="sort-master-summary"></div><div class="sort-actions"><button id="newBtn" class="btn btn-primary">＋ 新規登録</button><label class="btn btn-outline">Excel / CSV取込<input id="masterFile" type="file" accept=".csv,.xlsx,.xls" hidden></label><button id="exportBtn" class="btn btn-outline">マスター出力</button></div><div id="message" class="sort-message"></div></section>
 <section class="card sort-card"><h3>配置</h3><div id="slotGrid" class="sort-master-grid"></div></section>
 <section class="card sort-card"><h3>一覧編集</h3><input id="search" class="sort-master-search" type="search" placeholder="仕分け先コード・仕分け先名で検索"><div class="sort-master-table-wrap"><table class="sort-master-table"><thead><tr><th>配置No.</th><th>仕分け先コード</th><th>仕分け先名</th><th>状態</th><th>操作</th></tr></thead><tbody id="masterRows"></tbody></table></div></section>
 </main></div>
 <dialog id="entryDialog" class="sort-master-dialog"><form id="entryForm" method="dialog"><h3 id="dialogTitle">新規登録</h3><label>仕分け先コード *<input id="entryCode" required><small>仕分け先コードは登録後変更できません</small></label><label>仕分け先名 *<input id="entryName" required></label><label>配置No. *<input id="entrySlot" type="number" min="1" step="1" required></label><label id="enabledLabel"><input id="entryEnabled" type="checkbox" checked> 有効</label><div id="entryError" class="sort-message sort-master-entry-error" role="alert" aria-live="polite"></div><div class="sort-actions"><button value="cancel" class="btn btn-outline">キャンセル</button><button id="saveEntry" value="default" class="btn btn-primary">保存</button></div></form></dialog>
 <dialog id="diffDialog" class="sort-master-dialog"><form method="dialog"><h3>マスター変更内容</h3><pre id="diffSummary" class="sort-preview"></pre><details><summary>詳細を見る</summary><pre id="diffDetails" class="sort-preview"></pre></details><p>ファイルにない既存仕分け先は変更しません（Upsert方式）。</p><div class="sort-actions"><button value="cancel" class="btn btn-outline">キャンセル</button><button id="applyImport" value="default" class="btn btn-primary">反映する</button></div></form></dialog>
 <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><script src="js/firebase-config.js"></script><script src="js/sort-state-manager.js?v=sort-master-20260819c"></script><script src="js/pages/sort-master.js?v=sort-master-20260819c"></script>
</body></html>
